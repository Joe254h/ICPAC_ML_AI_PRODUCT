services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unversioned}"
        INSTALL_MODEL_RUNTIMES: "${INSTALL_MODEL_RUNTIMES:-false}"
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: sqlite:////app/data/prototype.db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-prototype}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      ARTIFACT_ROOT: /app/artifacts
      # Downloaded ECMWF ensembles and CHIRPS weeks, and the product packages, are kept
      # in the data volume.
      DATA_ROOT: /app/data/observations
      RUN_ROOT: /app/data/runs
      FORECAST_INPUT_ROOT: /app/data/forecasts
      LLM_API_KEY: ${LLM_API_KEY:-}
      BULLETIN_OPERATOR_KEY: ${BULLETIN_OPERATOR_KEY:-}
      STAFF_CREDENTIALS: ${STAFF_CREDENTIALS:-}
      RELEASE_MODE: ${RELEASE_MODE:-evaluation}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # With n8n coordinating (docker compose --profile n8n up), the service sends it
      # signed events and n8n starts the weekly cycle instead of the built-in schedule.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      AUTOMATION_SCHEDULER_ENABLED: ${AUTOMATION_SCHEDULER_ENABLED:-false}
    volumes:
      - climate-data:/app/data
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    environment: {API_URL: "http://backend:8000"}
    depends_on:
      backend: {condition: service_healthy}
  # The coordinator (deploy/n8n/README.md): docker compose --profile n8n up -d, after
  # deploy/n8n/setup.sh has imported the workflows and credentials.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    profiles: ["n8n"]
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY (32+ random characters)}
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Africa/Nairobi
      TZ: Africa/Nairobi
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflows read their settings from the environment and check signatures.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      ICPAC_API_URL: http://backend:8000
      ICPAC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      ICPAC_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      ICPAC_NOTIFY_EMAIL: ${ICPAC_NOTIFY_EMAIL:-}
      ICPAC_NOTIFY_FROM: ${ICPAC_NOTIFY_FROM:-}
      ICPAC_NOTIFY_WEBHOOK: ${ICPAC_NOTIFY_WEBHOOK:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./deploy/n8n/workflows:/workflows:ro
    depends_on:
      backend: {condition: service_healthy}
volumes:
  climate-data:
  n8n-data:
