services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unversioned}"
        INSTALL_MODEL_RUNTIMES: "${INSTALL_MODEL_RUNTIMES:-false}"
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: sqlite:////app/data/prototype.db
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-prototype}
      ARTIFACT_ROOT: /app/artifacts
      DATA_ROOT: /app/observations
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes: ["climate-data:/app/data", "./artifacts:/app/artifacts:ro", "./observations:/app/observations:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    ports: ["127.0.0.1:3000:3000"]
    environment: {API_URL: "http://backend:8000"}
    depends_on:
      backend: {condition: service_healthy}
volumes:
  climate-data:
