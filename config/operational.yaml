# Operational Week-2 inference on the authoritative ICPAC-11 domain.
#
# Every scientific value here is taken from the HPC artifacts or must be copied from the
# frozen training code. Values marked REQUIRED are null on purpose: the pipeline refuses
# to run until they are set and names the missing key, rather than guessing.
# Evidence for derived values: docs/hpc_integration_audit.md.
version: week2-operational-v2
task: week2_precipitation_operational
experiment: MBC_EXPERIMENT_20261005

grid:
  # Authoritative ML grid: 800 latitude x 700 longitude points at 0.05 degrees,
  # ascending in both axes. Cells are numbered in C order (lat_index * 700 + lon_index).
  shape: [800, 700]
  latitude: [-14.975, 24.975]
  longitude: [19.025, 53.975]
  domain_cells: 205999
  # Repository-relative unless absolute; ICPAC_MASK_PATH overrides.
  mask_path: artifacts/domain/authoritative_icpac11_mask.npz

ecmwf:
  member_dim: number
  step_dim: step
  level_dim: isobaricInhPa
  # ECMWF numbering: control = 0, perturbed = 1..N. Training used perturbed members
  # only (HPC files *_pf_*), so the control member is excluded from the features.
  control_member_number: 0
  include_control_member: false
  rainfall:
    variable: tp
    # ECMWF tp is accumulated from initialization ("cumulative"); "daily" accepts
    # 24-hour totals labelled by the step that ends each day.
    accumulation: cumulative
    # Days 8-14: the accumulation between the 168 h and 336 h forecast points.
    accumulation_steps_hours: [168, 336]
    # Rainfall not already on the 0.05 degree model grid (ECMWF Open Data is 0.25 degree)
    # is first averaged to the 1.5 degree grid of the ECMWF S2S forecasts the model was
    # trained on, then interpolated bilinearly to the cell centres, the method training
    # used for the pressure-level fields. OPERATIONAL CHOICE: replace both values with
    # the rainfall regridding of the frozen training code once it is supplied.
    regrid: bilinear
    training_resolution_degrees: 1.5
  pressure:
    # REQUIRED: the seven Week-2 step hours used for the atmospheric training features.
    week2_steps_hours: null

calendar:
  # Derived from the artifacts: the initialization month reproduces the MBC pair_count
  # exactly, and a 1-based initialization day of year over 365.25 days matches every
  # CatBoost split border on doy_sin and doy_cos.
  mbc_month_basis: initialization
  doy_basis: initialization
  doy_index_base: 1
  doy_year_length: 365.25

mbc:
  ratio_min: 0.05
  ratio_max: 20.0
  forecast_mean_floor: 0.1

abc:
  # Frozen on the 2020-2021 validation period: ABC = max(0, a*DPP + (1-a)*PPP).
  alpha: 0.124

periods:
  training: [2008, 2019]
  validation: [2020, 2021]
  # Independent test period: never used for tuning, fitting or model selection.
  protected_test: [2022, 2024]

feature_schemas:
  hybrid7:
    [X_mean, X_spread, latitude, longitude, doy_sin, doy_cos, MBC_forecast]
  atmos37:
    [
      X_mean, X_spread, latitude, longitude, doy_sin, doy_cos,
      q850_mean, q850_spread, q700_mean, q700_spread,
      u850_mean, u850_spread, v850_mean, v850_spread,
      wind850_mean, wind850_spread, qu850_mean, qu850_spread,
      qv850_mean, qv850_spread, qwind850_mean, qwind850_spread,
      t850_mean, t850_spread, t500_mean, t500_spread,
      deltaT850_500_mean, deltaT850_500_spread, gh500_mean, gh500_spread,
      u200_mean, u200_spread, v200_mean, v200_spread,
      shear200_850_mean, shear200_850_spread,
      MBC_forecast,
    ]
