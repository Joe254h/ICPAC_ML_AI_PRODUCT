# Registration descriptor: one policy of the frozen pre-refit ICPAC Week-2 model bundle
# (ICPAC_WEEK2_WEB_MODEL_20261025). Registration verifies the bundle manifest and every
# file it lists, the training contract, the MBC factors, the PCA and the 24-input schema,
# and runs a smoke prediction. It registers the model as experimental: it is never
# made active automatically (see docs/operational_models.md, model lifecycle).
model_id: icpac_week2_catboost_prerefit_v1
model_name: MBC + CatBoost residual (full correction)
version: 1.0.0-prerefit
experiment: ICPAC_RETRAIN_2005_2025_V1
baseline: MBC
family: hybrid7_pc17
algorithm: catboost
feature_schema: hybrid7_pc17
feature_count: 24
expected_trees: 300
training_period: "2005-2019"
validation_period: "2020-2021"
test_period: "2022-2024"
# The HPC's independent test result is recorded through the registry by a reviewer.
test_status: untested
declared_status: experimental
declared_by: Joe254h
policy: catboost_full
# The training code's seven upper-air leads (provenance/fullgrid_stats_mbc.py LEADS).
pressure_steps_hours: [192, 216, 240, 264, 288, 312, 336]
# Perturbed members per forecast in the 2005-2024 reforecasts the model was trained on.
ensemble_members: 10
# Frozen MBC factor range (prior 500, cap 3; lower clip 0.2).
mbc_factor_bounds: [0.2, 3.0]
# The bundle refuses real-time inputs from 2025 until their compatibility is confirmed.
realtime_gate_from: "2025-01-01"
notes: >-
  The full CatBoost correction, max(MBC + residual, 0): the lowest aggregate RMSE on the
  independent 2022-2024 test (15.204 mm/week, 551 cases). It was chosen as the web default
  after those scores were seen, so it is a descriptive choice, not an independent selection.

# Paths are relative to ARTIFACT_ROOT (the repository's artifacts/ by default).
artifacts:
  manifest: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/manifest.json
  model: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/artifacts/catboost_residual_fullrows.cbm
  metrics: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/verification/CATBOOST_VALIDATION_FULLGRID.json
  policy_manifest: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/config/HYBRID_POLICY_MANIFEST.json
  policies: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/config/deployment_policies.json
  feature_schema: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/config/feature_schema.json
  mbc: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/artifacts/mbc_monthly_prior500_cap3.npz
  pca: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/artifacts/pca_atmos30_train2005_2019.npz
  domain: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/artifacts/authoritative_icpac11_mask.npz
  independent_summary: bundles/ICPAC_WEEK2_WEB_MODEL_20261025/verification/global_skill_summary.csv

