# Input data sources of the operational Week-2 forecast.
#
# status: active   -> downloaded and processed by the platform
#         planned  -> listed for forecasters, no reader yet ("coming later")
version: data-sources-v1

ecmwf_opendata:
  # ECMWF Open Data (CC BY 4.0): the real-time ensemble (ENS), 0.25 degree, 15 days.
  # Mirrors are tried in order; data.ecmwf.int keeps the last few days, the AWS mirror
  # keeps an archive (from 2023), so older initializations come from there.
  mirrors: [aws, google, ecmwf]
  model: ifs
  resolution: 0p25
  stream: enfo
  # Perturbed members only, as in training (the control member is excluded).
  type: pf
  # The members kept: 1 to 10, the ensemble size the model was trained on (the ECMWF S2S
  # reforecasts have 11 members, a control and 10 perturbed; training read the perturbed
  # files). The real-time ensemble has 50 perturbed members; set [1, 50] to use them all.
  members: [1, 10]
  parameter: tp
  # The 00 UTC run of each initialization date.
  run_hour: 0
  # Crop of the global field kept on disk: wide enough for the 1.5 degree averaging
  # windows around the points that surround the model domain.
  area: {south: -16.5, north: 27.0, west: 16.5, east: 55.5}
  # The upper-air fields are 35 files (5 variables at 7 forecast hours); this many are
  # downloaded at a time. They are still checked one by one in a fixed order.
  parallel_downloads: 4
  licence: "ECMWF Open Data, CC BY 4.0 (https://www.ecmwf.int/en/forecasts/datasets/open-data)"

chirps:
  # CHIRPS v2.0 from the Climate Hazards Center server, read as ICPAC's climate monitoring
  # framework reads it: files are found by listing their directory (never by guessing a
  # name), only files not yet held are downloaded, transient failures are retried with a
  # doubling wait, every file is checked, and what is kept is cropped to the region.
  #
  # Daily files verify the Week-2 forecasts (a Week-2 window is seven days, not a dekad).
  # The final product is published about three weeks after each month; the preliminary
  # product a few days after each pentad. Final is used whenever it exists.
  final_dir: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/africa_daily/tifs/p05/{year}/"
  prelim_dir: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/prelim/global_daily/tifs/p05/{year}/"
  # Preliminary dekadal NetCDF (variable precip), the monitoring framework's own source.
  dekad_dir: "https://data.chc.ucsb.edu/products/CHIRPS-2.0/prelim/global_dekad/netcdf/"
  variable: precip
  # Kept files cover the model grid, which contains the framework's Greater Horn of
  # Africa box (20-53 E, 15 S - 24 N).
  crop: {south: -15.0, north: 25.0, west: 19.0, east: 54.0}
  retries: 5
  retry_wait_seconds: 5
  nodata: -9999.0
  # Dekadal percent of normal against the 1991-2020 long-term mean (the WMO normal used
  # by the framework). Needs a NetCDF of CHIRPS dekads covering that period (ICPAC keeps
  # one for its monitoring products); without it the anomaly is shown as in progress.
  # CHIRPS_DEKAD_CLIMATOLOGY overrides the file.
  climatology: {start: "1991-01-01", end: "2020-12-31", file: null}
  licence: "CHIRPS, Climate Hazards Center, UC Santa Barbara (public domain, cite Funk et al. 2015)"

tamsat:
  # TAMSAT v3.1 dekadal rainfall estimates (University of Reading), read like CHIRPS: the
  # newest dekad is found by listing the month's folder, downloaded once, checked and
  # cropped. TAMSAT_BASE_URL overrides the server (a mirror or the test server).
  base_url: "https://gws-access.jasmin.ac.uk/public/tamsat/rfe/data/v3.1"
  dekad_dir: "{base}/dekadal/{year}/{month:02d}/"
  # rfe_filled has gaps filled from the climatology; rfe is used when it is absent.
  variables: [rfe_filled, rfe]
  resolution_degrees: 0.0375
  licence: "TAMSAT, University of Reading (CC BY 4.0; cite Maidment et al. 2017)"

arc2:
  # NOAA CPC African Rainfall Climatology 2.0: daily totals (mm) for Africa at 0.1 degree,
  # one zipped GeoTIFF per day, published a day or two later (climate_engine/inputs/
  # daily_references.py). ARC2_BASE_URL overrides the server.
  base_url: "https://ftp.cpc.ncep.noaa.gov/fews/fewsdata/africa/arc2/geotiff"
  day_file: "africa_arc.{day:%Y%m%d}.tif.zip"
  format: cpc_geotiff_zip
  resolution_degrees: 0.1
  latency_days: 2
  licence: "ARC 2.0, NOAA Climate Prediction Center (public domain; cite Novella and Thiaw 2013)"

rfe2:
  # NOAA CPC African Rainfall Estimate 2.0, read like ARC 2.0. RFE2_BASE_URL overrides it.
  base_url: "https://ftp.cpc.ncep.noaa.gov/fews/fewsdata/africa/rfe2/geotiff"
  day_file: "africa_rfe.{day:%Y%m%d}.tif.zip"
  format: cpc_geotiff_zip
  resolution_degrees: 0.1
  latency_days: 2
  licence: "RFE 2.0, NOAA Climate Prediction Center (public domain; cite Xie and Arkin 1996)"

imerg:
  # NASA GPM IMERG Late Run daily (version 7), global 0.1 degree NetCDF4 from GES DISC,
  # about a day after each day. Downloads need a NASA Earthdata token, a server secret named
  # by token_env; the file name, with its version, is read from the month's listing.
  # IMERG_BASE_URL overrides the server.
  base_url: "https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/GPM_3IMERGDL.07"
  day_dir: "{year}/{month:02d}/"
  day_pattern: '3B-DAY-L\.MS\.MRG\.3IMERG\.{day:%Y%m%d}-S000000-E235959\.V\d+[A-Z]?\.nc4'
  format: imerg_netcdf
  variables: [precipitation, precipitationCal]
  resolution_degrees: 0.1
  latency_days: 2
  token_env: EARTHDATA_TOKEN
  licence: "GPM IMERG, NASA GES DISC (open data; cite Huffman et al. 2023)"

sources:
  - id: ecmwf
    name: ECMWF ensemble (ENS)
    role: forecast input
    status: active
    description: "Week-2 (days 8-14) ensemble rainfall: 10 perturbed members, as in training, 00 UTC run, 0.25 degree"
    provider: ECMWF Open Data
    url: https://www.ecmwf.int/en/forecasts/datasets/open-data
  - id: chirps
    name: CHIRPS v2.0
    role: verification (observed rainfall)
    status: active
    description: "Daily satellite-gauge rainfall, 0.05 degree; final product, else preliminary"
    provider: Climate Hazards Center, UC Santa Barbara
    url: https://www.chc.ucsb.edu/data/chirps
  - id: tamsat
    name: TAMSAT v3.1
    role: rainfall monitoring (observed rainfall)
    status: active
    description: "Dekadal satellite rainfall estimates for Africa, 0.0375 degree"
    provider: University of Reading
    url: https://www.tamsat.org.uk/
  - id: rfe2
    name: RFE 2.0
    role: rainfall monitoring and a further comparison (observed rainfall)
    status: active
    description: "NOAA CPC African Rainfall Estimate, daily, 0.1 degree"
    provider: NOAA Climate Prediction Center
    url: https://www.cpc.ncep.noaa.gov/products/fews/rfe.shtml
  - id: arc2
    name: ARC 2.0
    role: rainfall monitoring and a further comparison (observed rainfall)
    status: active
    description: "NOAA CPC African Rainfall Climatology, daily, 0.1 degree"
    provider: NOAA Climate Prediction Center
    url: https://www.cpc.ncep.noaa.gov/products/fews/AFR_CLIM/AMS_ARC2a.pdf
  - id: imerg
    name: GPM IMERG
    role: rainfall monitoring and a further comparison (observed rainfall)
    status: active
    description: "NASA Integrated Multi-satellitE Retrievals for GPM (Late Run), daily, 0.1 degree; needs a NASA Earthdata token"
    provider: NASA GES DISC
    url: https://gpm.nasa.gov/data/imerg
