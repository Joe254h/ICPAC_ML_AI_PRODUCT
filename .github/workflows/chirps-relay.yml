# CHIRPS relay: CHC refuses the Hugging Face Space ("429 Too Many Requests") and Spaces
# cannot use FTP, so this job reads CHIRPS from CHC every six hours and publishes the recent
# days and dekads, cut to the region, on the chirps-relay branch, which the service reads
# over HTTPS (config chirps.relay). CHC does not always answer GitHub's machines either: the
# same script also runs on a machine CHC serves (the ICPAC HPC, docs/chirps-relay.md), and
# runs from both add to the branch.
name: CHIRPS relay
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - scripts/chirps_relay.py
      - scripts/chirps_relay.sh
      - .github/workflows/chirps-relay.yml
permissions: {contents: write}
concurrency: {group: chirps-relay, cancel-in-progress: false}
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Read CHIRPS from CHC and publish it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/chirps_relay.sh "$RUNNER_TEMP/chirps-relay" "$GITHUB_REPOSITORY"
