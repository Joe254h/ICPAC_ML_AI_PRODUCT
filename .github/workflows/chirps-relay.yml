# CHIRPS relay: CHC refuses the Hugging Face Space ("429 Too Many Requests") and Spaces
# cannot use FTP, so this job reads CHIRPS from CHC (HTTPS, else FTP, else the NOAA mirror)
# every six hours and publishes the recent days and dekads, cut to the region, on the
# chirps-relay branch. The service reads them over HTTPS (config chirps.relay). The branch
# holds only the latest files: each run replaces it.
name: CHIRPS relay
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - scripts/chirps_relay.py
      - .github/workflows/chirps-relay.yml
permissions: {contents: write}
concurrency: {group: chirps-relay, cancel-in-progress: false}
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Files already relayed (kept, so final days are not read again)
        uses: actions/checkout@v4
        continue-on-error: true
        with: {ref: chirps-relay, path: relay}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Read CHIRPS from CHC
        run: python -m scripts.chirps_relay --store relay --days 120 --dekads 18
      - name: Publish on the chirps-relay branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp -r relay/index.json relay/daily publish/
          [ -d relay/dekad ] && cp -r relay/dekad publish/ || true
          cat > publish/README.md <<'EOF'
          CHIRPS v2.0 relayed for the ICPAC Week-2 service by .github/workflows/chirps-relay.yml
          (scripts/chirps_relay.py). Source: Climate Hazards Center, UC Santa Barbara.
          This branch is rewritten on every run.
          EOF
          cd publish
          git init -q -b chirps-relay
          git add -A
          git -c user.name='CHIRPS relay' -c user.email='actions@github.com' \
            commit -qm "CHIRPS relay $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" chirps-relay
