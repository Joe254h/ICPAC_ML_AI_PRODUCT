name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: icpac_test
          POSTGRES_USER: icpac_test
          POSTGRES_PASSWORD: local-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U icpac_test -d icpac_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev,postgres]'
      - name: Verify the committed HPC artifacts against their SHA256
        run: python -m scripts.verify_artifacts
      - run: ruff format --check backend climate_engine chatbot scripts
      - run: ruff check backend climate_engine chatbot scripts
      - run: mypy backend climate_engine chatbot
      - run: python -X faulthandler -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql://icpac_test:local-ci-test-only@127.0.0.1:5432/icpac_test
      - name: Test PowerShell deployment guards without cloud access
        shell: pwsh
        run: ./deploy/azure/tests/backend.Tests.ps1
      - uses: pnpm/action-setup@v4
        with: {version: '11.19.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend

  native-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev,models]'
      - run: pytest -q backend/tests/test_native_models.py
        env: {RUN_NATIVE_MODEL_TESTS: 'true', OMP_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1'}
